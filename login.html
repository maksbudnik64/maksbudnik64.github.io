<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://shop.volleyballworld.com/cdn/shop/files/img12_345d9141-a883-46c9-af70-458a7351b10b.jpg?v=1754471467&width=1080">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Beach Pro Tool · Вход</title>
</head>
<body>
    <div class="authContainer">
        <div class="authHeader">
            <h1>Вход</h1>
            <p><i class="fas fa-volleyball-ball" style="color:#c49a2c;"></i> С возвращением на площадку</p>
        </div>

        <div class="card">
            <form data-js-login-form>
                <div class="authFormGroup">
                    <label for="email">Email <span class="authRequired">*</span></label>
                    <input type="email" name="email" id="email" placeholder="david@example.com" required>
                </div>

                <div class="authFormGroup">
                    <label for="password">Пароль <span class="authRequired">*</span></label>
                    <input type="password" name="password" id="password" placeholder="Введите пароль" required>
                </div>

                <div class="authMessage" data-js-auth-message></div>

                <button type="submit" class="buttonAccent authSubmit">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
        </div>

        <div class="authLink">
            Нет аккаунта? <a href="registration.html">Зарегистрироваться</a>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
