<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://shop.volleyballworld.com/cdn/shop/files/img12_345d9141-a883-46c9-af70-458a7351b10b.jpg?v=1754471467&width=1080">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Beach Pro Tool · Активный турнир</title>
</head>
<body>
    <!-- ===== БОКОВАЯ ПАНЕЛЬ ===== -->
    <aside class="sideBar">
        <div class="logoArea">
            <div class="logoIcon"><i class="fas fa-volleyball-ball"></i></div>
            <div class="logoText">BeachProTool</div>
        </div>
        <a href="profile.html">
            <div class="userCard">
                <div class="userAvatar">ДО</div>
                <div class="userInfo">
                    <div class="userName">Дэвид Оман</div>
                    <div class="userRole">Защитник / 1000 elo</div>
                </div>
            </div>
        </a>
        <nav class="navMenu">
            <a href="index.html"><div class="navItem"><i class="fas fa-home"></i><span>Главная</span></div></a>
            <a href="events.html"><div class="navItem"><i class="far fa-calendar-alt"></i><span>События</span></div></a>
            <a href="draw.html"><div class="navItem"><i class="fas fa-random"></i><span>Жеребьёвка</span></div></a>
            <a href="tournaments.html"><div class="navItem active"><i class="fas fa-trophy"></i><span>Турниры</span></div></a>
            <a href="stats.html"><div class="navItem"><i class="fas fa-chart-line"></i><span>Статистика</span></div></a>
        </nav>
    </aside>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <div class="start-page-wrapper">
        <main class="mainContent">
            <!-- Верхняя панель -->
            <div class="topBar">
                <div class="topBarText">
                    <h1 id="tournament-title">Загрузка...</h1>
                    <p id="tournament-info"><i class="fas fa-trophy" style="color:#c49a2c;"></i> Загрузка информации...</p>
                </div>
                <div class="topActions">
                    <button class="buttonAccent" id="finish-tournament-btn"><i class="fas fa-flag-checkered"></i> Завершить</button>
                </div>
            </div>

            <!-- Вкладки навигации -->
            <div class="filterGroup" id="tab-container" style="margin-bottom: clamp(16px, 2vw, 24px);">
                <button id="tab-standings" class="buttonAccent"><i class="fas fa-table"></i> Таблица</button>
                <button id="tab-matches"><i class="fas fa-list"></i> Матчи</button>
                <button id="tab-bracket" style="display:none;"><i class="fas fa-sitemap"></i> Сетка</button>
                <button id="tab-counter"><i class="fas fa-stopwatch"></i> Счётчик</button>
            </div>

            <!-- Контейнер секций -->
            <div id="content-container" style="display: flex; flex-direction: column; gap: 20px;">

                <!-- Секция: Счётчик матча -->
                <div id="section-counter" class="section-block">
                    <div id="counter" class="card" style="align-items: center;" data-js-counter-card>
                        <div class="cardHeader">
                            <h3><i class="fas fa-stopwatch" style="color:#c49a2c;"></i> Счётчик матча</h3>
                            <span class="tag" id="match-status-tag">Выберите матч</span>
                        </div>

                        <div class="eventSelector" style="width: 100%; padding: 4px 0;">
                            <select id="counter-match-select" style="flex:1; min-width:200px; padding: 8px 12px; width: 100%; font-size: 0.95rem;">
                                <option value="">-- Выберите матч --</option>
                            </select>
                        </div>

                        <div class="eventSelector" style="width: 100%; padding: 4px 0;">
                            <div id="counter-team1-display" class="counter-team-name">Команда 1</div>
                            <span class="counter-vs">VS</span>
                            <div id="counter-team2-display" class="counter-team-name">Команда 2</div>
                        </div>

                        <div class="counter-score">
                            <span data-js-count-left>0</span>
                            <span>:</span>
                            <span data-js-count-right>0</span>
                        </div>

                        <div class="counter-sets-summary">
                            <span id="sets-team1-count">0</span>
                            <span>:</span>
                            <span id="sets-team2-count">0</span>
                        </div>

                        <div class="buttonCenter" style="padding: 6px 0;">
                            <button class="counter-btn-minus" data-js-counter-button-left-minus>−1</button>
                            <button class="counter-btn-plus" data-js-counter-button-left-plus>+1</button>
                            <span style="width: 12px;"></span>
                            <button class="counter-btn-minus" data-js-counter-button-right-minus>−1</button>
                            <button class="counter-btn-plus" data-js-counter-button-right-plus>+1</button>
                        </div>

                        <div class="statusButtons" style="margin: 6px 0; justify-content: center;">
                            <button class="buttonAccent" id="btn-reset-score" disabled>
                                <i class="fas fa-redo"></i> Сброс
                            </button>
                            <button class="buttonAccent" id="btn-next-set" disabled>
                                <i class="fas fa-forward"></i> Сет
                            </button>
                            <button class="buttonAccent" id="btn-finish-match" disabled>
                                <i class="fas fa-flag-checkered"></i> Матч
                            </button>
                        </div>

                        <div class="authMessage" data-js-auth-message style="display: none;"></div>
                    </div>
                </div>

                <!-- Секция: Группы -->
                <div id="section-groups" class="section-block"></div>

                <!-- Секция: Сетка -->
                <div id="section-bracket" class="section-block"></div>

            </div>
        </main>

        <!-- ===== НИЖНЯЯ НАВИГАЦИЯ (МОБИЛЬНАЯ) ===== -->
        <div class="bottomNav">
            <a href="index.html"><div class="bottomNavItem"><i class="fas fa-home"></i><span>Главная</span></div></a>
            <a href="events.html"><div class="bottomNavItem"><i class="fas fa-calendar-plus"></i><span>События</span></div></a>
            <a href="draw.html"><div class="bottomNavItem"><i class="fas fa-random"></i><span>Жеребьёвка</span></div></a>
            <a href="stats.html"><div class="bottomNavItem"><i class="fas fa-chart-bar"></i><span>Статистика</span></div></a>
            <a href="tournaments.html"><div class="bottomNavItem active"><i class="fas fa-trophy"></i><span>Турниры</span></div></a>
            <a href="profile.html"><div class="bottomNavItem"><i class="fas fa-user"></i><span>Профиль</span></div></a>
        </div>
    </div>

    <script type="module" src="activeTournament.js"></script>
</body>
</html>
