<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://shop.volleyballworld.com/cdn/shop/files/img12_345d9141-a883-46c9-af70-458a7351b10b.jpg?v=1754471467&width=1080">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Beach Pro Tool · Регистрация</title>
</head>
<body>
    <div class="authContainer">
        <div class="authHeader">
            <h1>Регистрация</h1>
            <p><i class="fas fa-volleyball-ball" style="color:#c49a2c;"></i> Присоединяйся к пляжному сообществу</p>
        </div>

        <div class="card">
            <form data-js-registration-form>
                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label for="name">Имя <span class="authRequired">*</span></label>
                        <input type="text" name="name" id="name" placeholder="Дэвид" required minlength="2">
                    </div>
                    <div class="authFormGroup">
                        <label for="surname">Фамилия <span class="authRequired">*</span></label>
                        <input type="text" name="surname" id="surname" placeholder="Оман" required minlength="2">
                    </div>
                </div>

                <div class="authFormGroup">
                    <label>Пол <span class="authRequired">*</span></label>
                    <div class="authRadioGroup">
                        <label><input type="radio" name="gender" value="male" required> Мужской</label>
                        <label><input type="radio" name="gender" value="female" required> Женский</label>
                    </div>
                </div>

                <div class="authFormGroup">
                    <label for="email">Email <span class="authRequired">*</span></label>
                    <input type="email" name="email" id="email" placeholder="david@example.com" required>
                </div>

                <div class="authFormGroup">
                    <label for="password">Пароль <span class="authRequired">*</span></label>
                    <div class="passwordWrapper">
                        <input type="password" name="password" id="password" placeholder="Минимум 6 символов" required minlength="6" maxlength="25">
                        <i class="togglePassword fas fa-eye" data-js-toggle-password></i>
                    </div>
                </div>

                <div class="authFormGroup">
                    <label for="city">Город</label>
                    <input type="text" name="city" id="city" placeholder="Например: Борисов">
                </div>

                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label for="dateOfBirth">Дата рождения</label>
                        <input type="date" name="dateOfBirth" id="dateOfBirth" max="">
                    </div>
                    <div class="authFormGroup">
                        <label for="height">Рост (см)</label>
                        <input type="number" name="height" id="height" placeholder="188" min="140" max="250">
                    </div>
                </div>

                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label for="position">Позиция</label>
                        <select name="position" id="position">
                            <option value="">Выберите</option>
                            <option>Защитник</option>
                            <option>Блокирующий</option>
                            <option>Универсал</option>
                        </select>
                    </div>
                    <div class="authFormGroup">
                        <label for="level">Уровень игры</label>
                        <select name="level" id="level">
                            <option value="">Выберите</option>
                            <option>Новичок</option>
                            <option>Любитель</option>
                            <option>Любитель+</option>
                            <option>Профи</option>
                        </select>
                    </div>
                </div>

                <div class="authMessage" data-js-auth-message></div>

                <button type="submit" class="buttonAccent authSubmit">
                    <i class="fas fa-user-plus"></i> Зарегистрироваться
                </button>
            </form>
        </div>

        <div class="authLink">
            Уже есть аккаунт? <a href="login.html">Войти</a>
        </div>
    </div>

    <script type="module" src="registration.js"></script>
</body>
</html>
