<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://shop.volleyballworld.com/cdn/shop/files/img12_345d9141-a883-46c9-af70-458a7351b10b.jpg?v=1754471467&width=1080">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Beach Pro Tool · События</title>
</head>
<body>
    <!-- ===== БОКОВАЯ ПАНЕЛЬ ===== -->
    <aside class="sideBar">
        <div class="logoArea">
            <div class="logoIcon"><i class="fas fa-volleyball-ball"></i></div>
            <div class="logoText">BeachProTool</div>
        </div>
        <a href="profile.html">
            <div class="userCard">
                <div class="userAvatar">—</div>
                <div class="userInfo">
                    <div class="userName" data-js-user-name>Загрузка...</div>
                    <div class="userRole" data-js-user-role>...</div>
                </div>
            </div>
        </a>
        <nav class="navMenu">
            <a href="index.html"><div class="navItem"><i class="fas fa-home"></i><span>Главная</span></div></a>
            <a href="events.html"><div class="navItem active"><i class="far fa-calendar-alt"></i><span>События</span></div></a>
            <a href="draw.html"><div class="navItem"><i class="fas fa-random"></i><span>Жеребьёвка</span></div></a>
            <a href="tournaments.html"><div class="navItem"><i class="fas fa-trophy"></i><span>Турниры</span></div></a>
            <a href="stats.html"><div class="navItem"><i class="fas fa-chart-line"></i><span>Статистика</span></div></a>
        </nav>
    </aside>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <main class="mainContent">
        <div class="topBar">
            <div class="topBarText">
                <h1>События и игры</h1>
                <p><i class="fas fa-map-marker-alt" style="color:#c49a2c;"></i> Все предстоящие игры</p>
            </div>
            <div class="topActions">
                <a href="createEvent.html"><button class="buttonAccent"><i class="fas fa-plus-circle"></i> Создать событие</button></a>
            </div>
        </div>

        <!-- Фильтры -->
        <div class="filtersSection">
            <span class="filterLabel">Вид:</span>
            <div class="filterGroup" data-filter-group="type">
                <button class="buttonAccent" data-filter-value="all">Все</button>
                <button data-filter-value="training"><i class="fas fa-dumbbell"></i> Тренировка</button>
                <button data-filter-value="game"><i class="fas fa-volleyball-ball"></i> Игра</button>
                <button data-filter-value="tournament"><i class="fas fa-trophy"></i> Турнир</button>
            </div>
            <span class="filterLabel">Уровень:</span>
            <div class="filterGroup" data-filter-group="level">
                <button class="buttonAccent" data-filter-value="all">Все</button>
                <button data-filter-value="Новичок"><i class="fas fa-seedling"></i> Новичок</button>
                <button data-filter-value="Любитель"><i class="fas fa-star"></i> Любитель</button>
                <button data-filter-value="Профи"><i class="fas fa-crown"></i> Профи</button>
            </div>
            <span class="filterLabel">Формат:</span>
            <div class="filterGroup" data-filter-group="format">
                <button class="buttonAccent" data-filter-value="all">Все</button>
                <button data-filter-value="2×2"><i class="fas fa-user-friends"></i> 2×2</button>
                <button data-filter-value="3×3"><i class="fas fa-users"></i> 3×3</button>
                <button data-filter-value="4×4"><i class="fas fa-users"></i> 4×4</button>
            </div>
        </div>

        <!-- Список событий -->
        <div class="mainBoard">
            <div class="card" style="text-align:center;padding:40px;">
                <div style="font-size:2rem;">⏳</div>
                <div style="font-weight:600;margin-top:8px;">Загрузка событий...</div>
            </div>
        </div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО: ЗАПИСЬ КОМАНДЫ ===== -->
    <div id="team-registration-modal" class="modal" style="display:none;">
        <div class="modal-content card" style="max-width: 500px; margin: 50px auto;">
            <div class="cardHeader">
                <h3>Запись команды</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="authMessage" style="display:none;"></div>
            <form id="team-registration-form">
                <input type="hidden" id="team-event-id" />
                <div id="team-players-container"></div>
                <button type="submit" class="buttonAccent authSubmit">Записать команду</button>
            </form>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: РЕДАКТИРОВАНИЕ СОБЫТИЯ ===== -->
    <div id="edit-event-modal" class="modal" style="display:none;">
    <div class="modal-content card" style="max-width:500px;max-height:90vh;overflow-y:auto;margin:20px auto;">
        <div class="cardHeader" style="position:sticky;top:0;background:white;z-index:1;">
            <h3>Редактирование события</h3>
            <button class="close-modal">&times;</button>
        </div>
        <form id="edit-event-form">
            <input type="hidden" id="edit-event-id"/>
            <h3 id="edit-title" style="margin-bottom:16px;font-weight:700;"></h3>
            <div class="authFormGroup">
                <label>Статус</label>
                <select id="edit-status" name="status">
                    <option value="pending">Набирается</option>
                    <option value="confirmed">Подтверждено</option>
                    <option value="cancelled">Отменено</option>
                </select>
            </div>
            <div class="authFormRow">
                <div class="authFormGroup">
                    <label>Дата</label>
                    <input type="date" id="edit-date" name="eventDate" required/>
                </div>
                <div class="authFormGroup">
                    <label>Время</label>
                    <input type="time" id="edit-time" name="eventTime" required/>
                </div>
            </div>
            <div class="authFormRow">
                <div class="authFormGroup">
                    <label>Формат</label>
                    <select id="edit-format" name="format" required>
                        <option value="">Выберите</option>
                        <option>2×2</option>
                        <option>3×3</option>
                        <option>4×4</option>
                    </select>
                </div>
                <div class="authFormGroup">
                    <label>Уровень</label>
                    <select id="edit-level" name="level">
                        <option value="">Любой</option>
                        <option value="Новичок">Новичок</option>
                        <option value="Любитель">Любитель</option>
                        <option value="Любитель+">Любитель+</option>
                        <option value="Профи">Профи</option>
                    </select>
                </div>
            </div>
            <div class="authFormRow">
                <div class="authFormGroup">
                    <label>Длительность (ч)</label>
                    <input type="number" id="edit-duration" name="duration" min="1" max="8"/>
                </div>
                <div class="authFormGroup">
                    <label>Макс. игроков</label>
                    <input type="number" id="edit-maxPlayers" name="maxPlayers" min="2" max="40"/>
                </div>
            </div>
            <div id="edit-tournament-fields" style="display:none;">
                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label>Тип турнира</label>
                        <select id="edit-tournamentGender" name="tournamentGender">
                            <option value="">Любой</option>
                            <option value="Мужской">Мужской</option>
                            <option value="Женский">Женский</option>
                            <option value="Миксты">Миксты</option>
                        </select>
                    </div>
                    <div class="authFormGroup">
                        <label>Формат турнира</label>
                        <select id="edit-tournamentFormat" name="tournamentFormat">
                            <option value="">Выберите</option>
                            <option>Король корта (каждый с каждым)</option>
                            <option>Групповой этап + плей-офф</option>
                            <option>Олимпийская система (на вылет)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="authFormGroup">
                <label>Место проведения</label>
                <input type="text" id="edit-location" name="location"/>
            </div>
            <div class="authFormGroup">
                <label>Описание</label>
                <textarea id="edit-description" name="description" rows="3"></textarea>
            </div>
            <button type="submit" class="buttonAccent authSubmit">Сохранить</button>
        </form>
    </div>
</div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: УПРАВЛЕНИЕ УЧАСТНИКАМИ ===== -->
    <div id="manage-participants-modal" class="modal" style="display:none;">
        <div class="modal-content card" style="max-width:500px;margin:50px auto;">
            <div class="cardHeader"><h3>Управление участниками</h3><button class="close-modal">&times;</button></div>
            <div id="participants-manage-list" style="max-height:400px;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ (МОБИЛЬНАЯ) ===== -->
    <div class="bottomNav">
        <a href="index.html"><div class="bottomNavItem"><i class="fas fa-home"></i><span>Главная</span></div></a>
        <a href="events.html"><div class="bottomNavItem active"><i class="fas fa-calendar-plus"></i><span>События</span></div></a>
        <a href="draw.html"><div class="bottomNavItem"><i class="fas fa-random"></i><span>Жеребьёвка</span></div></a>
        <a href="stats.html"><div class="bottomNavItem"><i class="fas fa-chart-bar"></i><span>Статистика</span></div></a>
        <a href="tournaments.html"><div class="bottomNavItem"><i class="fas fa-trophy"></i><span>Турниры</span></div></a>
        <a href="profile.html"><div class="bottomNavItem"><i class="fas fa-user"></i><span>Профиль</span></div></a>
    </div>

    <script type="module" src="events.js"></script>
    <script type="module" src="eventButtons.js"></script>
</body>
</html>
