<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="https://shop.volleyballworld.com/cdn/shop/files/img12_345d9141-a883-46c9-af70-458a7351b10b.jpg?v=1754471467&width=1080">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Beach Pro Tool · Создать событие</title>
</head>
<body>
    <div class="authContainer">
        <div class="authHeader">
            <h1>Создать событие</h1>
            <p><i class="fas fa-calendar-plus" style="color:#c49a2c;"></i> Тренировка, игра или турнир</p>
        </div>

        <div class="card">
            <div class="authMessage" data-js-auth-message></div>
            <form data-js-create-event-form>

                <!-- Тип события -->
                <div class="authFormGroup">
                    <label>Тип события <span class="authRequired">*</span></label>
                    <div class="authRadioGroup">
                        <label><input type="radio" name="eventType" value="training" checked> Тренировка</label>
                        <label><input type="radio" name="eventType" value="game"> Игра</label>
                        <label><input type="radio" name="eventType" value="tournament"> Турнир</label>
                    </div>
                </div>

                <!-- Доступ -->
                <div class="authFormGroup">
                    <label>Доступ <span class="authRequired">*</span></label>
                    <div class="authRadioGroup">
                        <label><input type="radio" name="accessType" value="open" checked> Открытый</label>
                        <label><input type="radio" name="accessType" value="application"> По заявкам</label>
                    </div>
                </div>

                <!-- Название -->
                <div class="authFormGroup">
                    <label for="title">Название <span class="authRequired">*</span></label>
                    <input type="text" name="title" id="title" placeholder="Например: Тренировка 2×2" required>
                </div>

                <!-- Дата и время -->
                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label for="eventDate">Дата <span class="authRequired">*</span></label>
                        <input type="date" name="eventDate" id="eventDate" required>
                    </div>
                    <div class="authFormGroup">
                        <label for="eventTime">Время <span class="authRequired">*</span></label>
                        <input type="time" name="eventTime" id="eventTime" value="17:30" required>
                    </div>
                </div>

                <!-- Формат и уровень -->
                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label for="format">Формат <span class="authRequired">*</span></label>
                        <select name="format" id="format" required>
                            <option>2×2</option>
                            <option>3×3</option>
                            <option>4×4</option>
                        </select>
                    </div>
                    <div class="authFormGroup">
                        <label for="level">Уровень <span class="authRequired">*</span></label>
                        <select name="level" id="level" required>
                            <option>Новичок</option>
                            <option>Любитель</option>
                            <option selected>Любитель+</option>
                            <option>Профи</option>
                        </select>
                    </div>
                </div>

                <!-- Длительность и макс. игроков -->
                <div class="authFormRow">
                    <div class="authFormGroup">
                        <label for="duration">Длительность (часов)</label>
                        <input type="number" name="duration" id="duration" placeholder="2" min="1" max="8" value="2">
                    </div>
                    <div class="authFormGroup">
                        <label for="maxPlayers">Макс. игроков <span class="authRequired">*</span></label>
                        <input type="number" name="maxPlayers" id="maxPlayers" placeholder="8" min="2" max="40" value="40" required>
                    </div>
                </div>

                <!-- Поля турнира (скрыты по умолчанию) -->
                <div class="authFormRow tournamentFields" data-js-tournament-fields>
                    <div class="authFormGroup">
                        <label for="tournamentGender">Тип турнира <span class="authRequired">*</span></label>
                        <select name="tournamentGender" id="tournamentGender">
                            <option>Мужской</option>
                            <option>Женский</option>
                            <option>Миксты</option>
                        </select>
                    </div>
                    <div class="authFormGroup">
                        <label for="tournamentFormat">Формат турнира <span class="authRequired">*</span></label>
                        <select name="tournamentFormat" id="tournamentFormat">
                            <option>Король корта (каждый с каждым)</option>
                            <option>Групповой этап + плей-офф</option>
                            <option>Олимпийская система (на вылет)</option>
                        </select>
                    </div>
                </div>

                <!-- Место проведения -->
                <div class="authFormGroup">
                    <label for="location">Место проведения <span class="authRequired">*</span></label>
                    <input type="text" name="location" id="location" placeholder="Например: Городской пляж, сетка 1" required>
                </div>

                <!-- Описание -->
                <div class="authFormGroup">
                    <label for="description">Описание</label>
                    <textarea name="description" id="description" rows="3" placeholder="Дополнительная информация: инвентарь, правила, пожелания..."></textarea>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" class="buttonAccent authSubmit">
                    <i class="fas fa-plus-circle"></i> Создать событие
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="createEvent.js"></script>
</body>
</html>
